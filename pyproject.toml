[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reels"
version = "0.1.0"
description = "Local Twitch VOD highlights pipeline — heuristic + Ollama VLM → YouTube & Reels clips"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6",
    "faster-whisper>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
    "nvidia-cuda-runtime-cu12>=12.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
reels = "reels.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reels"]

[tool.hatch.build.targets.sdist]
only-include = ["src/reels", "config", "prompts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
